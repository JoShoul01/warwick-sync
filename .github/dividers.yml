name: Auto-Assign Discord Dividers
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  assign-dividers:
    runs-on: ubuntu-latest
    steps:
      - name: Assign Divider Roles in Discord
        env:
          TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          node -e '
            const GUILD_ID = "1562921494730768455";
            const DIVIDER_ROLES = [
              "1563641576163647509", // ✦LORDSHIP✦
              "1563641417061114007", // ✦RANK✦
              "1563956530661949631", // ✦ALLEGIANCE✦
              "1563956669031907408"  // ✦REGION✦
            ];

            const sleep = (ms) => new Promise(r => setTimeout(r, ms));
            const ws = new WebSocket("wss://gateway.discord.gg/?v=10&encoding=json");

            ws.onmessage = async (e) => {
              const d = JSON.parse(e.data);
              if (d.op === 10) {
                ws.send(JSON.stringify({
                  op: 2,
                  d: {
                    token: process.env.TOKEN,
                    intents: 2,
                    properties: { os: "linux", browser: "node", device: "node" }
                  }
                }));
              }
              if (d.t === "READY") {
                ws.send(JSON.stringify({
                  op: 8,
                  d: { guild_id: GUILD_ID, query: "", limit: 0 }
                }));
              }
              if (d.t === "GUILD_MEMBERS_CHUNK") {
                const humans = d.d.members.filter(m => !m.user.bot);
                let assigned = 0;

                for (const m of humans) {
                  const roles = m.roles || [];
                  for (const divId of DIVIDER_ROLES) {
                    if (!roles.includes(divId)) {
                      const res = await fetch(`https://discord.com{GUILD_ID}/members/${m.user.id}/roles/${divId}`, {
                        method: "PUT",
                        headers: { Authorization: "Bot " + process.env.TOKEN }
                      });
                      if (res.ok) assigned++;
                      await sleep(350);
                    }
                  }
                }

                console.log("Assigned " + assigned + " divider roles in Discord.");
                ws.close();
                process.exit(0);
              }
            };
            setTimeout(() => { console.error("Timeout"); process.exit(1); }, 300000);
          '
